# -----------------------------------------------------------------------------
# Site Settings - Gaurav Kumar Gautam
# -----------------------------------------------------------------------------
locale                   : "en-US"
title                    : "Gaurav Kumar Gautam"
title_separator          : "|"
name                     : &name "Gaurav Kumar Gautam"
description              : &description "Geospatial AI and Earth observation researcher working on InSAR, spatial modelling, geohazards, and mining-environment applications."
url                      : "https://gautam-ism.github.io"
baseurl                  : ""
repository               : "Gautam-ism/Gautam-ism.github.io"
teaser                   :
og_image                 : "profile-field-hq.jpg"
breadcrumbs              : false
words_per_minute         : 160
future                   : false
read_more                : "disabled"
talkmap_link             : false

# SEO
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

# Social sharing
twitter:
  username               :
facebook:
  username               :
  app_id                 :
  publisher              :

social:
  type                   : Person
  name                   : *name
  links:
    - "https://scholar.google.com/citations?user=4chg1EwAAAAJ&hl=en"
    - "https://orcid.org/0009-0000-3032-1479"
    - "https://github.com/Gautam-ism"
    - "https://www.linkedin.com/in/gaukrgau"

analytics:
  provider               : false

# -----------------------------------------------------------------------------
# Site Author
# -----------------------------------------------------------------------------
author:
  name             : "Gaurav Kumar Gautam"
  avatar           : "profile-field-hq.jpg"
  bio              : "Geospatial AI & Earth Observation Researcher"
  location         : "Dhanbad, India"
  employer         : "IIT (ISM) Dhanbad"
  email            : "gaukrgau@gmail.com"
  googlescholar    : "https://scholar.google.com/citations?user=4chg1EwAAAAJ&hl=en"
  orcid            : "https://orcid.org/0009-0000-3032-1479"
  github           : "Gautam-ism"
  linkedin         : "gaukrgau"

# -----------------------------------------------------------------------------
# Reading Files
# -----------------------------------------------------------------------------
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# -----------------------------------------------------------------------------
# Conversion
# -----------------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/
timezone: Asia/Kolkata

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

compress_html:
  clippings: all
  ignore:
    envs: development

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Gautam-ism"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/gaukrgau"
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=4chg1EwAAAAJ&hl=en"
    - label: "ORCID"
      icon: "fab fa-fw fa-orcid"
      url: "https://orcid.org/0009-0000-3032-1479"

copyright                : "Gaurav Kumar Gautam"
copyright_url            : "https://gautam-ism.github.io"
